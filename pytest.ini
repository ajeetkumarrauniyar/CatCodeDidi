[pytest]
testpaths = tests
# `live` and `audio` reach real external services, so they are opt-in: a
# rate-limited API or a flaky network must not make the default run
# non-deterministic. Run them explicitly with `pytest -m live` / `-m audio`.
addopts = -q -m "not audio and not live"
markers =
    gui: needs a working Tk display (skipped automatically when unavailable)
    live: hits the real Gemini API; opt in with -m live (needs GEMINI_API_KEY)
    audio: plays real sound through gTTS + speakers; opt in with -m audio
